# Supabase CLI local config. Em produção apontamos para projeto Supabase Cloud.
project_id = "crm-florista-b2b"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Better Auth substitui o GoTrue. Desligamos auth do Supabase para evitar dupla fonte de verdade.
[auth]
enabled = false

# Storage e Realtime ficam desligados em Fase 0 — entram conforme necessidade.
[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = false
